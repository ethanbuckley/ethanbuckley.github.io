<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Modelling vocabulary growth — og card</title>
<!--
  Source for assets/og-card-vocab-modelling.png, the og:image for
  vocabulary-growth-modelling-explainer.html.
  Canvas is 1200 x 630 CSS px (1.91:1); render at 2x via figures/render.sh.
  The chart is the real matplotlib panel from figures/panels/; do not redraw it.
-->
<style>
  :root{
    --paper:#ffffff; --ink:#14181d; --ink-soft:#5b6571; --ink-faint:#8a949c;
    --serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:var(--paper)}
  #card{width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--ink);
        font-family:var(--sans);display:flex;align-items:center;gap:36px;padding:44px 48px}
  .txt{flex:1;display:flex;flex-direction:column;height:100%;padding:8px 0 4px}
  h1{font-family:var(--serif);font-size:44px;line-height:1.2;font-weight:700;
     letter-spacing:-.02em;max-width:10em}
  .sub{font-size:20px;line-height:1.5;color:var(--ink-soft);margin-top:18px;max-width:20em}
  .url{margin-top:auto;font-size:17px;color:var(--ink-faint)}
  .panel{flex:0 0 auto}
  .panel img{display:block;width:768px;height:550px}
</style>
</head>
<body>
<div id="card">
  <div class="txt">
    <h1>Modelling vocabulary growth</h1>
    <p class="sub">The statistics and computation: a hierarchical Beta-Binomial with Gaussian-process age trends, fitted to 576 children.</p>
    <p class="url">ethanbuckley.github.io</p>
  </div>
  <figure class="panel">
    <img src="panels/production-ratio-panel.png" width="768" height="550" alt="">
  </figure>
</div>
</body>
</html>
