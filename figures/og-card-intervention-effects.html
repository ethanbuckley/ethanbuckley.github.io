<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The intervention lifted reading — og card</title>
<!--
  Source for assets/og-card-intervention-effects.png, the og:image for
  reading-language-predictors-explainer.html and its LinkedIn Featured thumbnail.
  Canvas is 1200 x 630 CSS px (1.91:1); render at 2x via figures/render.sh.
  The chart is the real matplotlib panel from figures/panels/; do not redraw it.
-->
<style>
  :root{
    --paper:#ffffff; --ink:#17242c; --ink-soft:#52606a; --ink-faint:#8a949c;
    --serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:var(--paper)}
  #card{width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--ink);
        font-family:var(--sans);position:relative;padding:44px 48px 0}
  h1{font-family:var(--serif);font-size:41px;line-height:1.15;font-weight:700;
     letter-spacing:-.02em}
  .sub{font-size:20px;line-height:1.5;color:var(--ink-soft);margin-top:10px}
  .panel{display:block;margin:16px auto 0;width:900px;height:420px}
  .url{position:absolute;left:48px;bottom:20px;font-size:17px;color:var(--ink-faint)}
</style>
</head>
<body>
<div id="card">
  <h1>The intervention lifted reading, not broad vocabulary</h1>
  <p class="sub">The randomised effect of the teaching on each skill, with 95% credible intervals.</p>
  <img class="panel" src="panels/intervention-effects-panel.png" width="900" height="420" alt="">
  <p class="url">ethanbuckley.github.io</p>
</div>
</body>
</html>
