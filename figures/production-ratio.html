<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Share of understood words that children with Down syndrome also say, by age</title>
<!--
  Source for one of the four research plates. Canvas is 1600 x 1000 CSS px; render at 2x via figures/render.sh.
  Chart-first: a sentence-case title, a one-line subtitle, the panel at full width, no source line (the page caption carries the fit and its date). No decoration.
-->
<style>
  :root{
    --paper:#ffffff; --ink:#14181d; --ink-soft:#5b6571; --accent:#2440b3; --accent-2:#6b7480; --line:#e4e7eb;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:var(--paper)}
  #fig{width:1600px;height:1000px;overflow:hidden;background:var(--paper);color:var(--ink);
       font-family:var(--sans);display:flex;flex-direction:column;padding:54px 64px 54px}
  h1{font-size:30px;font-weight:600;line-height:1.2;letter-spacing:-.005em;color:var(--ink);max-width:1360px}
  .sub{font-size:19px;line-height:1.45;color:var(--ink-soft);margin-top:10px;max-width:1360px}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 0 8px}
  .panel img{display:block;width:1472px;height:780px}
</style>
</head>
<body>
<div id="fig">
  <header>
    <h1>Share of understood words that children with Down syndrome also say, by age</h1>
    <p class="sub">Posterior median with 50% and 89% credible bands, from a hierarchical Bayesian model fitted to 1,424 parent-report vocabulary assessments pooled from 14 datasets in six countries.</p>
  </header>
  <main>
    <figure class="panel"><img src="panels/production-ratio-panel.png" width="1472" height="780" alt=""></figure>
  </main>
</div>
</body>
</html>
