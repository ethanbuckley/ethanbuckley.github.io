<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>How the models were chosen</title>
<!--
  Source for assets/asset-generation-og.png, the og:image for
  asset-generation-explainer.html and therefore the LinkedIn Featured thumbnail.
  Canvas is 1200 x 630 CSS px (the 1.91:1 Open Graph ratio); render at 2x via
  figures/render.sh to get the 2400 x 1260 master, which is downscaled to 1200 x 630.
  The schematic is the same four-layer SVG as asset-generation-explainer.html; if you
  change it there, change it here.
-->
<style>
  :root{
    --ground:#edf1f3; --paper:#ffffff; --ink:#17242c; --ink-soft:#52606a;
    --accent:#0f766e; --accent-2:#a4490a; --line:#d5dde2; --tint:#e4eeeb;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:var(--paper)}
  #fig{width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--ink);
       font-family:var(--sans);display:flex;flex-direction:column;padding:44px 56px 0}
  header{border-bottom:1px solid var(--line);padding-bottom:20px}
  .eyebrow{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.14em;
           text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--serif);font-size:37px;font-weight:700;line-height:1.08;
     letter-spacing:-.008em;margin-top:11px;color:var(--ink)}
  main{flex:1;min-height:0;display:flex;align-items:center;padding:18px 0 0}
  .schematic{width:100%}
  .schematic svg{width:100%;height:auto;display:block}
  footer{font-family:var(--mono);font-size:13px;letter-spacing:.03em;color:var(--ink-soft);
         border-top:1px solid var(--line);padding:16px 0 20px;white-space:nowrap;overflow:hidden}
  footer b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="fig">
  <header>
    <p class="eyebrow">Down Syndrome Education International &middot; teaching materials</p>
    <h1>A specification, layered so a fix goes to the narrowest layer that covers it</h1>
  </header>
  <main>
    <div class="schematic">
<svg viewBox="0 0 620 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of the four specification layers, stacked from broadest to narrowest: style presets applying to every image; a master prompt of about 2,500 words applying to every word; a glossary giving each recurring subject a canonical description and an approved reference photograph; and a per-word context line. Side labels show that a class of wrong images is fixed by a master-prompt rule, while a single wrong image is fixed in the glossary.">
        <rect x="30" y="16" width="560" height="44" rx="3" style="fill:var(--tint);stroke:var(--line);stroke-width:1"/>
        <text x="44" y="35" font-size="10.5" style="font-family:var(--mono);letter-spacing:.1em;font-weight:600;fill:var(--accent)">STYLE PRESETS</text>
        <text x="576" y="35" text-anchor="end" font-size="9" style="font-family:var(--mono);letter-spacing:.08em;fill:var(--ink-soft)">EVERY IMAGE</text>
        <text x="44" y="50" font-size="9.5" style="font-family:var(--mono);letter-spacing:.04em;fill:var(--ink-soft)">composition and difficulty</text>

        <rect x="30" y="72" width="440" height="44" rx="3" style="fill:var(--tint);stroke:var(--line);stroke-width:1"/>
        <text x="44" y="91" font-size="10.5" style="font-family:var(--mono);letter-spacing:.1em;font-weight:600;fill:var(--accent)">MASTER PROMPT · ~2,500 WORDS</text>
        <text x="456" y="91" text-anchor="end" font-size="9" style="font-family:var(--mono);letter-spacing:.08em;fill:var(--ink-soft)">EVERY WORD</text>
        <text x="44" y="106" font-size="9.5" style="font-family:var(--mono);letter-spacing:.04em;fill:var(--ink-soft)">content rules for the whole set</text>
        <text x="482" y="90" font-size="9" style="font-family:var(--mono);letter-spacing:.06em;font-weight:600;fill:var(--accent-2)">&#8592; CLASS OF IMAGES</text>
        <text x="482" y="103" font-size="9" style="font-family:var(--mono);letter-spacing:.06em;font-weight:600;fill:var(--accent-2)">WRONG: RULE HERE</text>

        <rect x="30" y="128" width="360" height="44" rx="3" style="fill:var(--tint);stroke:var(--line);stroke-width:1"/>
        <text x="44" y="147" font-size="10.5" style="font-family:var(--mono);letter-spacing:.1em;font-weight:600;fill:var(--accent)">GLOSSARY</text>
        <text x="376" y="147" text-anchor="end" font-size="9" style="font-family:var(--mono);letter-spacing:.08em;fill:var(--ink-soft)">RECURRING SUBJECTS</text>
        <text x="44" y="162" font-size="9.5" style="font-family:var(--mono);letter-spacing:.04em;fill:var(--ink-soft)">canonical description + approved reference</text>
        <text x="402" y="146" font-size="9" style="font-family:var(--mono);letter-spacing:.06em;font-weight:600;fill:var(--accent-2)">&#8592; ONE IMAGE WRONG:</text>
        <text x="402" y="159" font-size="9" style="font-family:var(--mono);letter-spacing:.06em;font-weight:600;fill:var(--accent-2)">FIX THE SUBJECT HERE</text>

        <rect x="30" y="184" width="280" height="44" rx="3" style="fill:var(--tint);stroke:var(--line);stroke-width:1"/>
        <text x="44" y="203" font-size="10.5" style="font-family:var(--mono);letter-spacing:.1em;font-weight:600;fill:var(--accent)">PER-WORD CONTEXT</text>
        <text x="296" y="203" text-anchor="end" font-size="9" style="font-family:var(--mono);letter-spacing:.08em;fill:var(--ink-soft)">ONE WORD</text>
        <text x="44" y="218" font-size="9.5" style="font-family:var(--mono);letter-spacing:.04em;fill:var(--ink-soft)">which sense · what the picture shows</text>
      </svg>
    </div>
  </main>
  <footer><b>4,307 audio clips</b> &middot; 10 English accents &middot; voices ranked in a blind A/B arena &middot; ethanbuckley.github.io</footer>
</div>
</body>
</html>
